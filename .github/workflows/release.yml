name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-armv7
          - goos: darwin
            goarch: amd64
            suffix: macos-intel
          - goos: darwin
            goarch: arm64
            suffix: macos-apple-silicon
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          go mod tidy
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -trimpath \
            -o brhttp-${{ matrix.suffix }}${{ matrix.ext }} \
            ./main.go

      - name: Compress (non-Windows)
        if: matrix.goos != 'windows'
        run: |
          tar -czf brhttp-${{ matrix.suffix }}.tar.gz brhttp-${{ matrix.suffix }}
          sha256sum brhttp-${{ matrix.suffix }}.tar.gz >> checksums.txt

      - name: Compress (Windows)
        if: matrix.goos == 'windows'
        run: |
          zip brhttp-${{ matrix.suffix }}.zip brhttp-${{ matrix.suffix }}.exe
          sha256sum brhttp-${{ matrix.suffix }}.zip >> checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brhttp-${{ matrix.suffix }}
          path: |
            brhttp-${{ matrix.suffix }}.tar.gz
            brhttp-${{ matrix.suffix }}.zip
            checksums.txt

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        run: |
          cat dist/checksums.txt | sort -u > CHECKSUMS.txt

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          echo "## brhttp ${VERSION}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📦 Instalação rápida (Linux/macOS)" >> RELEASE_NOTES.md
          echo '```bash' >> RELEASE_NOTES.md
          echo "curl -fsSL https://raw.githubusercontent.com/henriquetourinho/brhttp/main/install.sh | sh" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📥 Downloads manuais" >> RELEASE_NOTES.md
          echo "| Plataforma | Arquivo |" >> RELEASE_NOTES.md
          echo "|---|---|" >> RELEASE_NOTES.md
          echo "| Linux x64 | \`brhttp-linux-amd64.tar.gz\` |" >> RELEASE_NOTES.md
          echo "| Linux ARM64 | \`brhttp-linux-arm64.tar.gz\` |" >> RELEASE_NOTES.md
          echo "| Linux ARMv7 | \`brhttp-linux-armv7.tar.gz\` |" >> RELEASE_NOTES.md
          echo "| macOS Intel | \`brhttp-macos-intel.tar.gz\` |" >> RELEASE_NOTES.md
          echo "| macOS Apple Silicon | \`brhttp-macos-apple-silicon.tar.gz\` |" >> RELEASE_NOTES.md
          echo "| Windows x64 | \`brhttp-windows-amd64.zip\` |" >> RELEASE_NOTES.md
          echo "| Windows ARM64 | \`brhttp-windows-arm64.zip\` |" >> RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: brhttp ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            CHECKSUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
